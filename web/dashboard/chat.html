<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WarungAI Chat Bot</title>
    <link rel="stylesheet" href="/dashboard/css/chat.css?v=2" />
    <script defer src="/dashboard/js/chat.js"></script>
  </head>
  <body>
    <main class="sim-stage">
      <!-- OWNER PHONE -->
      <section class="phone-shell phone-shell--owner">
        <header class="chat-header">
          <a class="back-button" id="backLink" href="/dashboard" aria-label="Kembali">‹</a>
          <div class="bot-avatar" aria-hidden="true">W</div>
          <div class="bot-meta">
            <h1>WarungAI</h1>
            <p id="presenceText">online</p>
          </div>
          <span class="phone-tag">Pemilik</span>
        </header>

        <section class="message-list" id="messageList" aria-live="polite">
          <div class="day-chip">Hari ini</div>
          <article class="bubble bubble--in">
            <p>Halo, saya WarungAI. Kirim transaksi seperti di WhatsApp. Ketik /bantuan untuk melihat daftar perintah.</p>
            <time></time>
          </article>
        </section>

        <footer class="composer">
          <textarea
            id="messageInput"
            class="message-input"
            rows="1"
            placeholder="Ketik pesan"
            autocomplete="off"
          ></textarea>
          <button id="voiceButton" class="send-button" type="button" aria-label="Rekam voice note">
            <span id="sendIcon">●</span>
          </button>
        </footer>
      </section>

      <!-- CUSTOMER PHONE (display-only: messages the warung sends to the customer) -->
      <section class="phone-shell phone-shell--customer">
        <header class="chat-header chat-header--customer">
          <div class="bot-avatar bot-avatar--customer" aria-hidden="true">P</div>
          <div class="bot-meta">
            <h1 id="customerName">Pelanggan</h1>
            <p>pesan dari warung</p>
          </div>
          <span class="phone-tag phone-tag--customer">Pelanggan</span>
        </header>

        <section class="message-list" id="customerMessageList" aria-live="polite">
          <div class="day-chip" id="customerPlaceholder">
            Pesan untuk pelanggan (kasbon, pengingat) muncul di sini
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
