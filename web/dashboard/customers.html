<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WarungAI Pelanggan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/css/tokens.css" />
    <link rel="stylesheet" href="/dashboard/css/styles.css" />
    <link rel="stylesheet" href="/dashboard/css/customers.css" />
    <script defer src="/dashboard/js/customers.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand"><span class="brand__mark">W</span><span>WarungAI</span></div>
        <nav>
          <ul class="nav-pills">
            <li><a id="dashboardNavLink" href="/dashboard">Dashboard</a></li>
            <li><a id="chatNavLink" href="/dashboard/chat">Chat Bot</a></li>
            <li><a id="b2bNavLink" href="/dashboard/b2b">B2B Data</a></li>
            <li><a id="productsNavLink" href="/dashboard/products">Produk</a></li>
            <li><a class="active" href="/dashboard/customers">Pelanggan</a></li>
          </ul>
        </nav>
        <div class="topbar__meta">
          <span id="customerCountLabel">0 pelanggan</span>
        </div>
      </div>
    </header>

    <main class="canvas">
      <section class="hero-row">
        <div>
          <p class="eyebrow">Smart CRM</p>
          <h1 class="shop-title">Pelanggan Warung</h1>
        </div>
        <div class="actions">
          <select id="segmentFilter" class="period-select" aria-label="Segment">
            <option value="all">Semua segment</option>
            <option value="champion">Champion</option>
            <option value="loyal">Loyal</option>
            <option value="at_risk">At risk</option>
            <option value="dormant">Dormant</option>
            <option value="unsegmented">Belum segmentasi</option>
          </select>
          <input
            id="dashboardToken"
            class="owner-input"
            autocomplete="off"
            placeholder="dash_..."
            aria-label="Dashboard token"
          />
        </div>
      </section>

      <section class="customers-layout">
        <article class="widget-card customers-card">
          <div class="widget-card__header">
            <h2 class="widget-card__title">Daftar Pelanggan</h2>
            <span class="muted">Loyalty · RFM · kasbon</span>
          </div>
          <div class="table-wrap">
            <table class="customers-table">
              <thead>
                <tr>
                  <th>Nama</th>
                  <th>WhatsApp</th>
                  <th>Loyalty</th>
                  <th>Segment</th>
                  <th>Kasbon</th>
                  <th>Credit</th>
                </tr>
              </thead>
              <tbody id="customersBody">
                <tr>
                  <td colspan="6"><div class="empty-state">Masukkan dashboard token</div></td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
